<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SMR Lab</title>
    <!-- GitHub Pages SPA redirect: redirects 404s back to index.html with the path preserved -->
    <script>
      // Single Page App redirect for GitHub Pages
      // Stores the path in sessionStorage and redirects to the root
      var pathSegmentsToKeep = 1; // number of path segments to keep (1 = keep repo name)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
